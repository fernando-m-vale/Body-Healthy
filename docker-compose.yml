services:
  postgres:
    image: postgres:17
    container_name: body-healthy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bodyhealthy
      POSTGRES_PASSWORD: bodyhealthy
      POSTGRES_DB: body_healthy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
